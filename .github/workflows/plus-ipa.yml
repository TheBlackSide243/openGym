# openGym Plus (this fork's `plus` branch): the iPhone app as an .ipa for Sideloadly/AltStore, built on a GitHub macOS runner the way
# .gitlab-ci.yml's build:ios does it. The archive is unsigned; the .app then gets an ad-hoc
# signature that carries App.entitlements, so the tool that re-signs it with your Apple ID
# keeps HealthKit.
name: Plus iOS IPA

on:
  push:
    branches: [plus]
    # The Feather source (feather/) changes after a release; it builds nothing.
    paths-ignore: ['feather/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    # v1.4.2's code needs a recent iOS 26 SDK (Background Assets' AssetPackManager.localStatus,
    # missing from macos-15's Xcode 26.3). macos-27 has Xcode 27: iOS 27.1 is the SDK that knows the
    # iPhone Duo, whose screens an app built with an older one gets boxed on (black bars).
    runs-on: macos-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The newest Xcode on the runner, not only a 26: an app built with an SDK that does not know a
      # phone's screen runs boxed on it (black bars, rounded corners), as on a new foldable.
      - name: Newest Xcode (at least 26, the iOS 26 SDK)
        run: |
          ls -d /Applications/Xcode*.app
          # A release candidate counts (macos-27 has 27.1 only as one); a beta does not.
          XC=$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null | grep -vi 'beta' | sort -V | tail -1)
          case "$XC" in */Xcode_2[6-9]*|*/Xcode_[3-9][0-9]*) ;; *) echo "no Xcode 26 or newer on this runner"; exit 1;; esac
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Mobile bundle, synced into ios/ (cap sync runs pod install)
        working-directory: frontend
        run: |
          npm ci
          npm run build:mobile

      # As upstream's ios.yml device-archive: the animation packs' downloader, the Apple Watch app and
      # the widgets with the Live Activity are added to the project by these scripts, not committed.
      - run: ruby ios/ci/add-asset-downloader.rb
        working-directory: frontend
      - run: ruby ios/ci/add-watch-app.rb
        working-directory: frontend
      - run: ruby ios/ci/add-widgets.rb
        working-directory: frontend

      - name: Archive without signing
        working-directory: frontend/ios/App
        run: |
          set -o pipefail
          # The Plus version on the iPhone, 1.4.2-4 written 1.4.2.4: Feather and Settings show the
          # app's own version, which stayed openGym's 1.4.2 for every Plus release. Given on the
          # command line, it is every target's, so the watch app and the widgets still match the app.
          IOS_VERSION=$(node -p "require('../../package.json').version.replace(/-/g, '.')")
          echo "version $IOS_VERSION"
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$IOS_VERSION" \
            archive | tail -80

      - name: Package the .ipa, entitlements embedded
        working-directory: frontend/ios/App
        run: |
          set -eu
          rm -rf Payload && mkdir Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          # Innermost first: frameworks, the extensions (widgets, the downloader) and the watch app
          # with what it holds, each ad hoc, so the tool that re-signs it finds every bundle signed.
          find Payload/App.app -depth -mindepth 1 \( -name '*.framework' -o -name '*.appex' -o -name '*.app' -o -name '*.dylib' \)             -exec codesign -f -s - {} \;
          codesign -f -s - --entitlements App/App.entitlements Payload/App.app
          codesign -d --entitlements - Payload/App.app
          VER="$(node -p "require('../../package.json').version")"
          zip -qry "$GITHUB_WORKSPACE/openGym-$VER-unsigned.ipa" Payload
          ls -la "$GITHUB_WORKSPACE"/*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: openGym-plus-ipa
          path: openGym-*-unsigned.ipa
          retention-days: 30
