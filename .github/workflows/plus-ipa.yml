# openGym Plus (this fork's `plus` branch): the iPhone app as an .ipa for Sideloadly/AltStore, built on a GitHub macOS runner the way
# .gitlab-ci.yml's build:ios does it. The archive is unsigned; the .app then gets an ad-hoc
# signature that carries App.entitlements, so the tool that re-signs it with your Apple ID
# keeps HealthKit.
name: Plus iOS IPA

on:
  push:
    branches: [plus]
    # The Feather source (feather/) changes after a release; it builds nothing.
    paths-ignore: ['feather/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    # v1.4.2's code needs a recent iOS 26 SDK (Background Assets' AssetPackManager.localStatus,
    # missing from macos-15's Xcode 26.3), as upstream's ios.yml: macos-26, newest Xcode picked below.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26 (the iOS 26 SDK)
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$XC" || { echo "no Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Mobile bundle, synced into ios/ (cap sync runs pod install)
        working-directory: frontend
        run: |
          npm ci
          npm run build:mobile

      # As upstream's ios.yml device-archive: the animation packs' downloader, the Apple Watch app and
      # the widgets with the Live Activity are added to the project by these scripts, not committed.
      - run: ruby ios/ci/add-asset-downloader.rb
        working-directory: frontend
      - run: ruby ios/ci/add-watch-app.rb
        working-directory: frontend
      - run: ruby ios/ci/add-widgets.rb
        working-directory: frontend

      - name: Archive without signing
        working-directory: frontend/ios/App
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -80

      - name: Package the .ipa, entitlements embedded
        working-directory: frontend/ios/App
        run: |
          set -eu
          rm -rf Payload && mkdir Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          # Innermost first: frameworks, the extensions (widgets, the downloader) and the watch app
          # with what it holds, each ad hoc, so the tool that re-signs it finds every bundle signed.
          find Payload/App.app -depth -mindepth 1 \( -name '*.framework' -o -name '*.appex' -o -name '*.app' -o -name '*.dylib' \)             -exec codesign -f -s - {} \;
          codesign -f -s - --entitlements App/App.entitlements Payload/App.app
          codesign -d --entitlements - Payload/App.app
          VER="$(node -p "require('../../package.json').version")"
          zip -qry "$GITHUB_WORKSPACE/openGym-$VER-unsigned.ipa" Payload
          ls -la "$GITHUB_WORKSPACE"/*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: openGym-plus-ipa
          path: openGym-*-unsigned.ipa
          retention-days: 30
