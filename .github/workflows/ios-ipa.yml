# Personal build, only on this fork's ios-build branch (never part of a pull request): the
# iPhone app as an .ipa for Sideloadly/AltStore, built on a GitHub macOS runner the way
# .gitlab-ci.yml's build:ios does it. The archive is unsigned; the .app then gets an ad-hoc
# signature that carries App.entitlements, so the tool that re-signs it with your Apple ID
# keeps HealthKit.
name: iOS IPA (personal)

on:
  push:
    branches: [ios-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    # v1.4.2's code needs the iOS 26 SDK (Background Assets' AssetPackManager), as upstream's ios.yml.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Mobile bundle, synced into ios/ (cap sync runs pod install)
        working-directory: frontend
        run: |
          npm ci
          npm run build:mobile

      # As upstream's ios.yml device-archive: the animation packs' downloader, the Apple Watch app and
      # the widgets with the Live Activity are added to the project by these scripts, not committed.
      - run: ruby ios/ci/add-asset-downloader.rb
        working-directory: frontend
      - run: ruby ios/ci/add-watch-app.rb
        working-directory: frontend
      - run: ruby ios/ci/add-widgets.rb
        working-directory: frontend

      - name: Archive without signing
        working-directory: frontend/ios/App
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -80

      - name: Package the .ipa, entitlements embedded
        working-directory: frontend/ios/App
        run: |
          set -eu
          rm -rf Payload && mkdir Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          # Innermost first: frameworks, the extensions and the watch app, each ad hoc.
          find Payload/App.app -depth -mindepth 1 \( -name '*.framework' -o -name '*.appex' -o -name '*.app' -o -name '*.dylib' \) -exec codesign -f -s - {} \;
          codesign -f -s - --entitlements App/App.entitlements Payload/App.app
          codesign -d --entitlements - Payload/App.app
          VER="$(node -p "require('../../package.json').version")"
          zip -qry "$GITHUB_WORKSPACE/openGym-$VER-unsigned.ipa" Payload
          ls -la "$GITHUB_WORKSPACE"/*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: openGym-ipa
          path: openGym-*-unsigned.ipa
          retention-days: 14
