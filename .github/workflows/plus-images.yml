# openGym Plus (this fork's `plus` branch): the api and web images, for `docker compose pull`.
# Published as ghcr.io/<owner>/opengym-plus-api and -web, tags `latest` and the commit.
name: Plus images

on:
  push:
    branches: [plus]
    # The Feather source (feather/) changes after a release; it builds nothing.
    paths-ignore: ['feather/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: api
            context: ./api
            file: ./api/Dockerfile
            target: default
          - image: web
            context: .
            file: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner (registry names must be lowercase)
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=plus-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/opengym-plus-${{ matrix.image }}:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/opengym-plus-${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=openGym Plus, a fork of openGym (AGPL-3.0-or-later)
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha,scope=plus-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=plus-${{ matrix.image }}
