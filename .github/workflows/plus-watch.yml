# openGym Plus for Apple Watch (watch/): generates the Xcode project with XcodeGen, builds the app
# for the watch simulator and, unsigned, for a real watch, and takes a screenshot of each page in
# the simulator with sample data. Installing on a watch needs signing with an Apple Developer
# account (watch/README.md); the artifact carries the unsigned build for that.
name: Plus watchOS

on:
  push:
    branches: [plus]
    paths: ['watch/**', '.github/workflows/plus-watch.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: watch
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Build for the watch simulator
        run: |
          xcodebuild -project OpenGymWatch.xcodeproj -scheme OpenGymWatch -configuration Debug \
            -sdk watchsimulator -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -n 120

      - name: Build for a real watch, unsigned
        run: |
          xcodebuild -project OpenGymWatch.xcodeproj -scheme OpenGymWatch -configuration Release \
            -sdk watchos -destination 'generic/platform=watchOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tail -n 60
          mkdir -p out
          (cd build/Build/Products/Release-watchos && zip -qry "$GITHUB_WORKSPACE/watch/out/openGym-watch-unsigned.zip" openGym.app)

      - name: Screenshots in the simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          watch = [x for rt, xs in d.items() if "watchOS" in rt for x in xs]
          big = [x for x in watch if "Ultra" in x["name"] or "46mm" in x["name"] or "45mm" in x["name"]]
          print((big or watch)[0]["udid"])')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-watchsimulator/openGym.app
          mkdir -p out/screenshots
          for tab in 0 1 2 3; do
            xcrun simctl launch --terminate-running-process "$UDID" app.opengym.plus.watch -demo -tab "$tab"
            sleep 8
            xcrun simctl io "$UDID" screenshot "out/screenshots/page-$tab.png"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: openGym-watch
          path: watch/out
          if-no-files-found: error
